[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/telegram/session"
  to = "/.netlify/functions/telegram-session"
  status = 200

[[redirects]]
  from = "/api/duels/:duelId/join"
  to = "/.netlify/functions/duels-join"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
